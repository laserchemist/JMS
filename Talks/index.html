    height: 100%;

    margin: 0;

    background: #000;

  }
  .reveal .slide-number {
    background: rgba(0,0,0,0.55);
    color: #ddd;
    font-size: 14px;
  }
  /* simple title/cover slide */
  .cover {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    color: #f2f2f2;
  }
  .cover h1 {
    font-size: 2.2em;
    margin-bottom: 0.3em;
  }
  .cover p {

    font-size: 0.9em;
    letter-spacing: 0.04em;
